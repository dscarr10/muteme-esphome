# MuteMe as a mute button for Microsoft Teams calls on your Android phone.
# Needs the MuteMe Call Companion app (android/ folder) on the phone, with notification access.
# Colours: solid green = muted (OK to talk to me), solid red = live on a call (stop).
#
# Before using:
#  1. Create two toggle helpers (Settings → Devices & services → Helpers → Toggle):
#       "Phone call active"  → input_boolean.phone_call_active
#       "Phone call muted"   → input_boolean.phone_call_muted
#  2. Pick your own random webhook ID below and put the same URL in the phone app:
#       https://<your-ha-address>/api/webhook/<webhook_id>
#  3. Replace notify.mobile_app_YOUR_PHONE with your phone's notify action.

# 1. Phone app → Home Assistant: keep the helpers in sync with the call
- id: call_companion_webhook
  alias: Call companion → call and mute state
  triggers:
    - trigger: webhook
      webhook_id: muteme_call_CHANGE_ME          # make this long and random
      allowed_methods: [POST]
      local_only: false                          # false = works through Nabu Casa / remote URL
  actions:
    - action: "input_boolean.turn_{{ 'on' if trigger.json.in_call else 'off' }}"
      target:
        entity_id: input_boolean.phone_call_active
    - action: "input_boolean.turn_{{ 'on' if trigger.json.muted else 'off' }}"
      target:
        entity_id: input_boolean.phone_call_muted
  mode: queued

# 2. MuteMe tap: during a call toggle Teams mute; otherwise pause/resume the light
#    (replaces the plain "tap to pause" automation)
- id: muteme_tap_pause_display
  alias: MuteMe → tap (mute during calls, otherwise pause light)
  triggers:
    - trigger: event
      event_type: esphome.muteme_button
      event_data:
        action: tap
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.phone_call_active
              state: "on"
          sequence:
            - action: notify.mobile_app_YOUR_PHONE
              data:
                message: command_broadcast_intent
                data:
                  intent_package_name: dev.mutemebridge.callcompanion
                  intent_action: dev.mutemebridge.callcompanion.TOGGLE_MUTE
      default:
        - action: input_boolean.toggle
          target:
            entity_id: input_boolean.muteme_display_paused
  mode: single

